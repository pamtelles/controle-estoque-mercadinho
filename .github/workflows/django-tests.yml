
name: Testes automatizados Django

on:
  push:
    branches: [main, feature/codigo-barras]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar testes
        env:
          SECRET_KEY: "chave-temporaria-exclusiva-para-testes-automatizados"
          DEBUG: "True"
        run: python manage.py test estoque
