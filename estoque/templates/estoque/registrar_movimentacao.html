<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Movimentação de Estoque | Mercadinho</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <main class="container py-5" style="max-width: 700px;">
        <h1>Registrar Movimentação</h1>
        <p class="text-secondary mb-4">
            Registre entradas e saídas de mercadorias.
        </p>

        <form method="post" class="card p-4 shadow-sm">
            {% csrf_token %}

            {% for field in form %}
            <div class="mb-3">
                <label for="{{ field.id_for_label }}" class="form-label">
                    {{ field.label }}
                </label>

                {{ field }}

                {% for error in field.errors %}
                <div class="text-danger mt-1" role="alert">
                    {{ error }}
                </div>
                {% endfor %}
            </div>
            {% endfor %}

            <button type="submit" class="btn btn-primary w-100 py-3">
                Confirmar movimentação
            </button>
        </form>

        <a href="{% url 'consultar_estoque' %}" class="btn btn-outline-secondary mt-3">
            Voltar para consulta de estoque
        </a>
    </main>

</body>

</html>
